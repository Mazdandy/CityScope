<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CityScope</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1412;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfe6dc;
      }
      canvas {
        display: block;
      }

      /*
       * The HUD overlay (T7). It sits over the canvas, so the whole layer is
       * `pointer-events: none` and only the interactive parts opt back in —
       * a readout that swallowed a drag would break painting underneath it.
       */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      #hud > * {
        position: absolute;
        margin: 0;
        background: rgba(8, 20, 18, 0.78);
        border: 1px solid rgba(124, 224, 176, 0.22);
        border-radius: 6px;
        padding: 6px 10px;
      }

      .hud-stats {
        top: 8px;
        left: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 3px 14px;
        align-items: baseline;
        max-width: 46vw;
      }
      .hud-field {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }
      .hud-field-label {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6f9d8c;
      }
      .hud-field-value {
        font-weight: 600;
        color: #d9f4e8;
      }
      /*
       * A field M1 cannot compute. The value is a dash, never a number, and the
       * styling says so too — the acceptance for T7 is that the HUD presents no
       * figure the build did not calculate (§16.3).
       */
      .hud-field[data-placeholder='true'] .hud-field-value {
        font-weight: 400;
        color: #547266;
      }
      .hud-field[data-placeholder='true'] {
        cursor: help;
      }

      /* §6.11's demand bars: three empty meters, because M1 has no demand model. */
      .hud-bars {
        display: inline-flex;
        gap: 3px;
        align-items: flex-end;
        height: 12px;
      }
      .hud-bar {
        width: 7px;
        height: 100%;
        border: 1px solid #3d5c4f;
        border-radius: 1px;
        background: repeating-linear-gradient(
          to top,
          transparent 0 4px,
          rgba(61, 92, 79, 0.5) 4px 5px
        );
      }

      .hud-palette {
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 6px;
        background: rgba(8, 20, 18, 0.86);
      }
      .hud-tool {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 58px;
        padding: 5px 8px;
        font: inherit;
        color: #cfe6dc;
        background: rgba(18, 38, 33, 0.92);
        border: 1px solid rgba(124, 224, 176, 0.28);
        border-radius: 5px;
        cursor: pointer;
      }
      .hud-tool:hover {
        border-color: #7ce0b0;
      }
      .hud-tool:focus-visible {
        outline: 2px solid #7ce0b0;
        outline-offset: 1px;
      }
      .hud-tool.is-active {
        color: #06120e;
        background: #7ce0b0;
        border-color: #bff3dc;
      }
      .hud-tool-slot {
        font-size: 10px;
        color: #6f9d8c;
      }
      .hud-tool-label {
        font-size: 11px;
      }
      .hud-tool-key {
        font-size: 9px;
        color: #6f9d8c;
      }
      .hud-tool.is-active .hud-tool-slot,
      .hud-tool.is-active .hud-tool-key {
        color: #2c5a49;
      }

      .hud-readout {
        top: 8px;
        right: 8px;
        white-space: pre;
        font-size: 11px;
        line-height: 1.45;
        color: #8fc7b0;
        max-width: 62ch;
        overflow: hidden;
      }

      /*
       * The unsupported-browser screen (T8.2). Shown *instead* of the game when
       * WebGL2 or Web Workers are missing, so the player reads a reason rather
       * than staring at an empty canvas — which is what the app looks like when
       * it fails to start at all.
       */
      .unsupported {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        margin: 0 auto;
        padding: 32px;
        max-width: 62ch;
        overflow: auto;
      }
      .unsupported h1 {
        margin: 0;
        font-size: 17px;
        color: #d9f4e8;
      }
      .unsupported p {
        margin: 0;
        color: #8fc7b0;
      }
      .unsupported-list {
        margin: 0;
        padding: 12px 14px;
        white-space: pre-wrap;
        color: #e0726c;
        background: rgba(8, 20, 18, 0.78);
        border: 1px solid rgba(224, 114, 108, 0.35);
        border-radius: 6px;
      }
      .unsupported-advice {
        color: #547266;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
